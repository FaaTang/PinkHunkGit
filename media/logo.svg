<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff8fc7"/>
      <stop offset="48%" stop-color="#ff4da6"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
    <linearGradient id="bgShine" x1="256" y1="32" x2="256" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nodeFill" x1="256" y1="90" x2="256" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#ffe4f0" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-15%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#b8004d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#bgShine)"/>
  <rect x="28" y="28" width="456" height="456" rx="92" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Classic Git branch (option A), scaled to 512 -->
  <g filter="url(#softShadow)" transform="translate(256 256) scale(14.5) translate(-12 -12)">
    <path d="M6 5v14" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M6 12c0 0 0 4 6 4h0" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M12 16 L17 9.5" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round"/>
    <circle cx="6" cy="5" r="2.5" fill="url(#nodeFill)" stroke="#ffffff" stroke-width="0.35"/>
    <circle cx="6" cy="19" r="2.5" fill="url(#nodeFill)" stroke="#ffffff" stroke-width="0.35"/>
    <circle cx="18" cy="8" r="2.5" fill="url(#nodeFill)" stroke="#ffffff" stroke-width="0.35"/>
    <circle cx="6" cy="5" r="0.9" fill="#ff4da6" fill-opacity="0.35"/>
    <circle cx="6" cy="19" r="0.9" fill="#ff4da6" fill-opacity="0.22"/>
    <circle cx="18" cy="8" r="0.9" fill="#ff4da6" fill-opacity="0.28"/>
  </g>
